name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: Test
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: CLI smoke test
        run: |
          ./target/release/osprey --version
          ./target/release/osprey scan
          ./target/release/osprey json > /dev/null
          ./target/release/osprey report > /dev/null

      - name: Build macOS app (Swift)
        if: runner.os == 'macOS'
        run: cd macos && swift build -c release
